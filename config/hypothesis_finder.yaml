# ============================================================
# НАСТРОЙКИ ПОИСКА ГИПОТЕЗ
# ============================================================
# Гипотеза — это отсутствующая прямая связь между двумя словами,
# которые имеют общего соседа в графе.
#
# Пример: шкаф → купе → духовой
# Если "шкаф" и "духовой" не связаны напрямую — это гипотеза.

hypothesis_finder:
  # ============================================================
  # ПАРАМЕТРЫ ПОИСКА
  # ============================================================
  # Глубина BFS (сколько рёбер от стартового слова)
  # 2 — стандарт (ищет пути старт → A → B)
  # 3 — глубже, но медленнее и больше шума
  max_depth: 2

  # Минимальный вес связи (частота совместного появления двух слов)
  # 100 — НЧ и выше
  # 500 — СЧ и выше
  # 1000 — ВЧ
  min_link_weight: 100

  # Минимальный вес ПРЯМОЙ связи, при которой гипотеза НЕ считается
  # Если прямая связь >= этого порога — путь не гипотеза
  # Обычно = min_link_weight
  direct_link_min_weight: 10

  # ============================================================
  # Вывод результатов
  # ============================================================
  # Печатать дерево гипотез в консоль
  show_tree: true

  # Печатать список найденных гипотез
  show_hypotheses: true

  # Печатать итоговую статистику
  show_statistics: true

  # Сохранять в JSON (дополнительно к txt)
  save_json: false

  # ============================================================
  # ИСКЛЮЧАЕМЫЕ ГРУППЫ
  # ============================================================
  # Слова из этих групп не участвуют в поиске гипотез
  # и не показываются в результатах.
  #
  # Указывайте имена групп как в БД (регистр важен).
  # Пустой список = не исключать ничего.
  exclude_groups:
    - Предлоги
    - Союзы
    - Частицы
    - Английские слова
    - Английские служебные слова
    - Контент 18+
    - Сленг
    - Микрозаймы

  # ============================================================
  # ПУТИ (обычно не меняются)
  # ============================================================
  paths:
    db: data/output/semantics.db
    start_words: data/input/start_words.txt
    output: data/output/hypotheses.txt